name: Disable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/disable-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  disable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error \
            --output response.txt \
            --write-out "%{http_code}" \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GH_API}/repos/${GH_REPOSITORY}/pages")

          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "GitHub Pages disabled (HTTP $status)."
            exit 0
          fi

          echo "Failed to disable GitHub Pages (HTTP $status)."
          cat response.txt
          exit 1
