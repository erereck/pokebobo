name: Apply Equipe Viva

on:
  push:
    branches:
      - feat/06-equipe-viva
    paths:
      - "patches/equipe-viva/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Expand cumulative 0.6.0 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat patches/equipe-viva/part*.b64 | base64 -d > /tmp/equipe.zip
          echo "0b4aa0e5467e8c74a48ad04958d90b80ffa6b21e8fb23a838d0d05f251d5cf9c  /tmp/equipe.zip" | sha256sum -c -
          unzip -q /tmp/equipe.zip -d /tmp/equipe
          ROOT=/tmp/equipe/pokebobo-0.6.0-equipe-viva
          cp "$ROOT/package.json" package.json
          cp -a "$ROOT/src/." src/
          cp -a "$ROOT/scripts/." scripts/
          cp -a "$ROOT/tests/." tests/

          # Correções incrementais produzidas depois do ZIP cumulativo.
          # Elas precisam sobrepor o payload antes da verificação.
          if [ -d patches/equipe-viva/overrides ]; then
            cp -a patches/equipe-viva/overrides/. ./
          fi

          node - <<'NODE'
          const fs = require("node:fs");
          const path = "package-lock.json";
          let text = fs.readFileSync(path, "utf8");
          let count = 0;
          text = text.replace(/"version": "0\.5\.0"/g, (match) =>
            ++count <= 2 ? '"version": "0.6.0"' : match
          );
          if (count < 2) throw new Error("package-lock root versions not found");
          fs.writeFileSync(path, text);
          NODE
          git rm -r patches/equipe-viva

      - name: Install dependencies
        run: npm ci

      - name: Verify architecture, tests and build
        run: npm run verify

      - name: Audit progression budget
        run: npm run balance:audit

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "0.6.0: Equipe Viva"
          git push origin HEAD:feat/06-equipe-viva
